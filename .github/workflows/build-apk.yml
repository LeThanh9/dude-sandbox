name: Build Dude Theft Wars APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "84831b87029642f92e2f29f4b043ff1490822586" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

      - name: Sync Game HTML Asset to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/DudeTheftWars-Mod-Dev-v0.9.1.1b.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DudeTheftWars-Mod-Dev-APK
          path: release-output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v0.9.1.1b-build-${{ github.run_number }}
          name: "Dude Theft Wars Mod Dev Edition (Build #${{ github.run_number }})"
          body: |
            ## 🌴 Dude Theft Wars 3D - Ultra Detailed 99% HD Edition (Dev Mod)
            ### 🛠️ Chi Tiết Bản Mod:
            - **Công Trình Map & Kiến Trúc Mới:**
              - 👑 **Dev Mega Skyscraper (120, 0, 180):** Trụ sở chọc trời 72m kèm bãi đỗ trực thăng Helipad và dốc xe ramp.
              - 🌌 **Dev Sky Arena & Mega Stunt Ramp (0, 85, 0):** Sàn đấu trên không 150mx150m, lan can an toàn và đường băng nhào lộn xe hơi lao xuống thành phố.
              - 🛡️ **Dev Military Bunker (-220, 0, -140):** Boong-ke quân sự tường bọc thép kiên cố, kho vũ khí RPG và Minigun.
              - 🏛️ **Ngân Hàng Trung Tâm & Kho Vàng** và 🌊 **Ngọn Hải Đăng Cảng Biển**.
            - **Cơ Chế Kích Hoạt Bí Mật DEV (Tuyệt Đối Không Gợi Ý UI):**
              - Đổi tên nhân vật thành `dev` (hoặc `DEV`) để mở khóa toàn bộ quyền Admin Console (Bất tử God Mode, Siêu tốc độ x3, Bay lượn Superhero, Tiền mặt vô hạn, Dịch chuyển tức thời).
              - Tuyệt đối không có bất kỳ autocomplete hay hiển thị gợi ý nào trong giao diện.
            - **Tải APK Trực Tiếp:** `DudeTheftWars-Mod-Dev-v0.9.1.1b.apk` đính kèm bên dưới!
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
