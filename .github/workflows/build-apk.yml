name: Build Dude Theft Wars APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Configure
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a328e447b7a8e9e14fb9d695c90" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Game Offline Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp three.min.js android/app/src/main/assets/three.min.js
          cp tailwind.js android/app/src/main/assets/tailwind.js
          cp all.min.css android/app/src/main/assets/all.min.css
          cp -r webfonts android/app/src/main/assets/webfonts || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/DudeTheftWars-Mod-Dev-v0.9.1.1b.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DudeTheftWars-Mod-Dev-APK
          path: release-output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v0.9.1.1b-build-${{ github.run_number }}
          name: "Dude Theft Wars Mod Dev Edition (Build #${{ github.run_number }})"
          body: |
            ## 🌴 Dude Theft Wars 3D - Ultra Detailed 99% HD Edition (100% Offline Bundle)
            ### 🛠️ Chi Tiết Sửa Lỗi Khởi Chạy:
            - **100% Offline Bundled Assets:** Đã nhúng trực tiếp `three.min.js`, `tailwind.js`, `all.min.css` và webfonts vào APK, không phụ thuộc vào kết nối mạng CDN ngoài.
            - **Native Activity Architecture:** Chuyển sang `android.app.Activity` thuần kèm theme `Theme.NoTitleBar.Fullscreen`, loại bỏ hoàn toàn lỗi crash theme `AppCompatActivity`.
            - **WebView Cross-Origin Unlock:** Mở cờ `setAllowUniversalAccessFromFileURLs(true)` và `setMixedContentMode` đảm bảo WebGL khởi chạy mượt mà ngay khi mở ứng dụng.
            - **Công Trình Map Mới:** Ngân Hàng Trung Tâm & Kho Vàng, Ngọn Hải Đăng Cảng Biển, Trụ Sở DEV Tối Thượng.
            - **Cơ Chế Kích Hoạt DEV:** Đổi tên thành `dev` để mở khóa Admin Console bí mật (không gợi ý).
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
